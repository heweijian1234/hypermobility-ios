name: HyperLog
options:
  bundleIdPrefix: com.zeronelabs
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "FZYVPK6336"
    CODE_SIGN_STYLE: Automatic

targets:
  HyperLog:
    type: application
    platform: iOS
    sources:
      - path: HyperLog
    info:
      path: HyperLog/Info.plist
      properties:
        CFBundleDisplayName: HyperLog
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 照片库添加权限（只读选取——粗版从相册导入关节照片）——测试期中文版
        NSPhotoLibraryUsageDescription: "HyperLog 让你从相册选一张照片附到关节记录上。照片只存在你的手机里。"
        # 🔴相机权限（拍照用——缺了必崩，健哥 11-04 实测崩溃根因）
        NSCameraUsageDescription: "HyperLog 让你直接拍照记录关节状况。照片只存在你的手机里。"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeronelabs.hyperlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  HyperLog:
    build:
      targets:
        HyperLog: all
    run:
      config: Debug
    archive:
      config: Release
