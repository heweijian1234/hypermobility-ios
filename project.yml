name: HyperLog
options:
  bundleIdPrefix: com.zeronelabs
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "FZYVPK6336"
    CODE_SIGN_STYLE: Automatic

targets:
  HyperLog:
    type: application
    platform: iOS
    sources:
      - path: HyperLog
    info:
      path: HyperLog/Info.plist
      properties:
        CFBundleDisplayName: HyperLog
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 照片库权限（选图附加到关节记录）
        NSPhotoLibraryUsageDescription: "HyperLog lets you attach photos to a joint entry. Photos stay on your phone."
        # 🔴相机权限（缺了必崩，健哥 11-04 实测崩溃根因）
        NSCameraUsageDescription: "HyperLog lets you photograph a joint directly. Photos stay on your phone."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeronelabs.hyperlog
        TARGETED_DEVICE_FAMILY: "1"
        # 11-25 UI 改版：纸感浅色设计，深色模式暂未适配 → 先锁 Light（不半吊子上线深色）
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  HyperLog:
    build:
      targets:
        HyperLog: all
    run:
      config: Debug
    archive:
      config: Release
